name: Deploy to Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Full history is required so git log can walk back to the previous
      # deployment SHA and list every commit in a multi-commit push (otherwise
      # the default shallow clone would only expose the latest commit).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Generate server/version.json before packaging.
      # The manifest stores the deployed commit SHA, deploy time and the commit
      # logs (changelog) between the previous deployment SHA and the current HEAD.
      # It is shipped inside source.tar.gz, extracted on the server and served by
      # GET /api/system/version so the web frontend can detect a finished
      # deployment, show an update dialog and auto-refresh.
      - name: Generate version manifest
        shell: bash
        run: |
          set -euo pipefail
          node - <<'EOF'
          const { execSync } = require('child_process');
          const fs = require('fs');
          const path = require('path');
          const sha = (process.env.GITHUB_SHA || '').trim();
          const ref = (process.env.GITHUB_REF_NAME || 'main').trim();
          const short = sha ? sha.slice(0, 7) : 'dev';
          let version = '0.1.0';
          try {
            const pkg = JSON.parse(fs.readFileSync('server/package.json', 'utf8'));
            if (pkg && pkg.version) version = pkg.version;
          } catch (e) {
            console.warn('Failed to read server/package.json: ' + e.message);
          }

          // Locate the previous deployed version.json (if any) to learn the SHA
          // of the last deployment. We only list commits that are NEW since the
          // previous deploy, so a push containing multiple commits will show the
          // entire batch instead of just the latest one (or an arbitrary last 10).
          let prevSha = '';
          const prevManifestPath = path.join('server', 'version.json');
          try {
            if (fs.existsSync(prevManifestPath)) {
              const prev = JSON.parse(fs.readFileSync(prevManifestPath, 'utf8'));
              if (prev && prev.sha) prevSha = prev.sha.trim();
            }
          } catch (e) {
            console.warn('Failed to read previous version.json: ' + e.message);
          }

          let commits = [];
          try {
            // Fetch full history so git log can walk back to the previous SHA
            // even when the runner did a shallow checkout.
            execSync('git fetch --unshallow --quiet || git fetch --quiet --depth=1000', { stdio: 'ignore' });

            // Build the revision range. If we know the previous deploy SHA and it
            // exists in history, list commits from (prevSha, HEAD]; otherwise list
            // the latest 50 as a sensible fallback.
            let range = null;
            if (prevSha) {
              try {
                execSync(`git cat-file -e ${prevSha}^{commit}`, { stdio: 'ignore' });
                range = `${prevSha}..${sha || 'HEAD'}`;
              } catch (e) {
                range = null;
              }
            }
            const logCmd = range
              ? `git log ${range} --pretty=format:%H%x1f%h%x1f%s%x1f%aI%x1f%an`
              : 'git log -50 --pretty=format:%H%x1f%h%x1f%s%x1f%aI%x1f%an';
            const raw = execSync(logCmd, { encoding: 'utf8' }).toString();
            commits = raw.split('\n').filter(Boolean).map((line) => {
              const [full, s, subject, date, author] = line.split('\x1f');
              return { sha: full, short: s, message: subject, date, author };
            });
          } catch (e) {
            console.warn('git log failed, changelog will be empty: ' + e.message);
          }

          // Always keep a complete recent-commits list too, so the manual
          // "view changelog" panel can still show context even if the range is empty.
          let recent = [];
          try {
            const raw = execSync(
              'git log -20 --pretty=format:%H%x1f%h%x1f%s%x1f%aI%x1f%an',
              { encoding: 'utf8' }
            ).toString();
            recent = raw.split('\n').filter(Boolean).map((line) => {
              const [full, s, subject, date, author] = line.split('\x1f');
              return { sha: full, short: s, message: subject, date, author };
            });
          } catch (e) {
            console.warn('git log (recent) failed: ' + e.message);
          }

          const manifest = {
            version,
            sha,
            short,
            ref,
            deployedAt: new Date().toISOString(),
            // message: headline of the latest commit in the deployment batch
            message: commits.length ? commits[0].message : (recent.length ? recent[0].message : ''),
            // commits: only the NEW commits since previous deployment (this push batch)
            commits,
            // recentCommits: always the latest 20, for manual changelog viewing
            recentCommits: recent,
            // prevSha: the deployment SHA this batch was built on top of
            prevSha,
            source: 'github-actions',
          };
          fs.mkdirSync('server', { recursive: true });
          fs.writeFileSync('server/version.json', JSON.stringify(manifest, null, 2));
          console.log('Generated server/version.json (batch=' + commits.length + ', recent=' + recent.length + ')');
          EOF

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf source.tar.gz \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='*.db' \
            --exclude='*.db-journal' \
            --exclude='*.tsbuildinfo' \
            --exclude='*.log' \
            --exclude='.env' \
            --exclude='.env.*' \
            server web
          tar -tzf source.tar.gz >/dev/null
          du -h source.tar.gz

      - name: Setup SSH key
        id: ssh-key
        shell: bash
        run: |
          set -euo pipefail
          key_path="$(mktemp)"
          printf '%s' "${{ secrets.WIN_SSH_KEY }}" > "$key_path"
          chmod 600 "$key_path"
          echo "key-path=$key_path" >> "$GITHUB_OUTPUT"

      - name: Normalize deployment path
        id: path
        shell: bash
        run: |
          set -euo pipefail
          WIN_PATH="${{ secrets.WIN_PATH }}"
          WIN_PATH="${WIN_PATH#${WIN_PATH%%[![:space:]]*}}"
          WIN_PATH="${WIN_PATH%${WIN_PATH##*[![:space:]]}}"

          if [[ "$WIN_PATH" =~ ^/([A-Za-z])(/.*)?$ ]]; then
            drive_letter="${BASH_REMATCH[1]^}"
            path_tail="${BASH_REMATCH[2]:-}"
            upload_path="${drive_letter}:/${path_tail#/}"
            windows_path="${drive_letter}:\\${path_tail#/}"
            windows_path="${windows_path//\//\\}"
          elif [[ "$WIN_PATH" =~ ^([A-Za-z]):[\\/](.*)$ ]]; then
            drive_letter="${BASH_REMATCH[1]^}"
            path_tail="${BASH_REMATCH[2]//\\//}"
            upload_path="${drive_letter}:/${path_tail}"
            windows_path="${drive_letter}:\\${path_tail}"
          elif [[ "$WIN_PATH" =~ ^/cygdrive/([A-Za-z])/(.*)$ ]]; then
            drive_letter="${BASH_REMATCH[1]^}"
            path_tail="${BASH_REMATCH[2]}"
            upload_path="/cygdrive/${drive_letter,,}/${path_tail}"
            windows_path="${drive_letter}:\\${path_tail//\//\\}"
          else
            echo "WIN_PATH must be /c/wwwroot/smdz, C:/wwwroot/smdz, or C:\\wwwroot\\smdz" >&2
            exit 1
          fi

          path_tail="${path_tail%/}"
          upload_path="${upload_path%/}"
          windows_path="${windows_path%\\}"
          if [[ -z "$path_tail" || "$path_tail" == *".."* || "$path_tail" =~ [^A-Za-z0-9._/-] ]]; then
            echo "WIN_PATH contains an empty, unsafe, or unsupported path segment" >&2
            exit 1
          fi

          echo "upload-path=$upload_path" >> "$GITHUB_OUTPUT"
          echo "windows-path=$windows_path" >> "$GITHUB_OUTPUT"

      - name: Upload rollback script
        shell: bash
        env:
          WIN_HOST: ${{ secrets.WIN_HOST }}
          WIN_USER: ${{ secrets.WIN_USER }}
          SSH_KEY_PATH: ${{ steps.ssh-key.outputs.key-path }}
          UPLOAD_PATH: ${{ steps.path.outputs.upload-path }}
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=/dev/null
            -o LogLevel=ERROR
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
          )

          scp_retry() {
            local source="$1"
            local destination="$2"
            local attempt
            for attempt in 1 2 3; do
              if scp -O "${ssh_options[@]}" "$source" "$destination"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "SCP failed (attempt $attempt/3), retrying in 5 seconds..." >&2
                sleep 5
              fi
            done
            echo "SCP failed after 3 attempts: $source -> $destination" >&2
            return 1
          }

          remote="${WIN_USER}@${WIN_HOST}"
          echo "===== Upload rollback script ====="
          scp_retry deploy/windows/rollback.ps1 "${remote}:${UPLOAD_PATH}/rollback.ps1"

      - name: Run deployment
        id: deploy
        continue-on-error: true
        shell: bash
        env:
          WIN_HOST: ${{ secrets.WIN_HOST }}
          WIN_USER: ${{ secrets.WIN_USER }}
          WIN_APP_NAME: ${{ secrets.WIN_APP_NAME }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
          SSH_KEY_PATH: ${{ steps.ssh-key.outputs.key-path }}
          UPLOAD_PATH: ${{ steps.path.outputs.upload-path }}
          WINDOWS_PATH: ${{ steps.path.outputs.windows-path }}
        run: |
          set -euo pipefail

          require_value() {
            local name="$1"
            local value="$2"
            if [[ -z "$value" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          }

          require_value WIN_HOST "${WIN_HOST:-}"
          require_value WIN_USER "${WIN_USER:-}"
          require_value WIN_APP_NAME "${WIN_APP_NAME:-}"
          require_value ENV_FILE "${ENV_FILE:-}"

          app_name="${WIN_APP_NAME}"
          if [[ ! "$app_name" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "WIN_APP_NAME may contain only letters, digits, dot, underscore, and hyphen" >&2
            exit 1
          fi

          ssh_options=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=/dev/null
            -o LogLevel=ERROR
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
          )

          scp_retry() {
            local source="$1"
            local destination="$2"
            local attempt
            for attempt in 1 2 3; do
              if scp -O "${ssh_options[@]}" "$source" "$destination"; then
                return 0
              fi
              if [[ "$attempt" -lt 3 ]]; then
                echo "SCP failed (attempt $attempt/3), retrying in 5 seconds..." >&2
                sleep 5
              fi
            done
            echo "SCP failed after 3 attempts: $source -> $destination" >&2
            return 1
          }

          remote="${WIN_USER}@${WIN_HOST}"

          echo "===== Upload source archive ====="
          scp_retry source.tar.gz "${remote}:${UPLOAD_PATH}/source.tar.gz"

          echo "===== Upload deployment script ====="
          scp_retry deploy/windows/deploy.ps1 "${remote}:${UPLOAD_PATH}/deploy.ps1"

          echo "===== Upload .env from secrets ====="
          env_path="$(mktemp)"
          trap 'rm -f "$env_path"' EXIT
          printf '%s' "$ENV_FILE" > "$env_path"
          sed -i 's/\r$//' "$env_path"
          scp_retry "$env_path" "${remote}:${UPLOAD_PATH}/.env.upload"

          echo "===== Run deployment ====="
          remote_command="powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \"${WINDOWS_PATH}\\deploy.ps1\" -DeploymentRoot \"${WINDOWS_PATH}\" -AppName \"${app_name}\" -EnvSource \"${WINDOWS_PATH}\\.env.upload\""
          ssh "${ssh_options[@]}" "$remote" "$remote_command"

      - name: Rollback on failure
        if: steps.deploy.outcome == 'failure'
        shell: bash
        env:
          WIN_HOST: ${{ secrets.WIN_HOST }}
          WIN_USER: ${{ secrets.WIN_USER }}
          WIN_APP_NAME: ${{ secrets.WIN_APP_NAME }}
          SSH_KEY_PATH: ${{ steps.ssh-key.outputs.key-path }}
          WINDOWS_PATH: ${{ steps.path.outputs.windows-path }}
        run: |
          set -euo pipefail
          echo "===== 部署失败，尝试远程回滚 (CI 安全网) ====="
          ssh_options=(
            -i "$SSH_KEY_PATH"
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile=/dev/null
            -o LogLevel=ERROR
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
          )
          remote="${WIN_USER}@${WIN_HOST}"
          rollback_cmd="powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File \"${WINDOWS_PATH}\\rollback.ps1\" -DeploymentRoot \"${WINDOWS_PATH}\" -AppName \"${WIN_APP_NAME}\""
          ssh "${ssh_options[@]}" "$remote" "$rollback_cmd"

      - name: Notify deployment result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.deploy.outcome }}" == "success" ]]; then
            echo "===== 部署成功 ====="
          elif [[ "${{ steps.deploy.outcome }}" == "failure" ]]; then
            echo "===== 部署失败（已执行回滚）====="
            exit 1
          else
            echo "===== 部署状态: ${{ steps.deploy.outcome }} ====="
          fi
